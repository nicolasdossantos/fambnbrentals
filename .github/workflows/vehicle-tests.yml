name: Vehicle form tests
on:
  pull_request:
    branches: [responsive]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand --testPathPattern=src/Components/Form
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"
